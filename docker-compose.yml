# docker-compose.yml

services:
  churn-prediction:
    build: .
    container_name: churn-prediction-app
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONDONTWRITEBYTECODE=1 # Забороняє python створювати __pycache__ всередині контейнера
    restart: unless-stopped
    